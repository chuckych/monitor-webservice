[WEBSERVICE]
; URL del webservice a monitorear (debe responder HTTP 201)
urlPing = "http://localhost:6400/RRHHWebService/Ping?"
; Carpeta donde se encuentra el log del webservice (se concatena LogWebServiceAAAAMMDD.txt)
pathLogWebservice = "C:/ruta/al/log/del/webservice"

[EMAIL]
; URL de la API de correo
apiMailUrl = "https://api.example.com/sendMail/"
; Token de autenticación
apiToken = "your-api-token-here"
; Email destinatario
recipient = "task-aws-mobile"
; Email de respuesta
replyTo = "task-aws-mobile"
; Directorio de logs del monitor
logFolder = "C:/logs/monitor"
; Subject del email (puede incluir placeholders: {status}, {time})
emailSubject = "[WEBSERVICE] Ping Fallido - {time}"
; Plantilla del cuerpo del email (ruta relativa al config.ini o absoluta)
emailTemplate = "email-template.txt"

[SETTINGS]
; Número máximo de reintentos
maxRetries = 1
; Tiempo entre reintentos en segundos
retryDelay = 1
; Timeout de conexión en ms
connectTimeout = 5000
; Timeout total en ms
executionTimeout = 10000
; Cache DNS en segundos
dnsCacheTimeout = 60
; Tiempo mínimo entre emails (segundos)
minEmailInterval = 300
; Retención de logs en días (los monitor_*.log más antiguos se eliminan)
logRetentionDays = 7
; Verificación SSL de cURL (1 = verificar, 0 = desactivar; por defecto 1 con cacert.pem del proyecto)
sslVerify = 1
; Ruta al CA bundle (por defecto el cacert.pem incluido en el proyecto)
caBundle = ""
; Envío de emails de notificación (1 = habilitado, 0 = deshabilitado; por defecto 1)
sendEmail = 1
